apiVersion: apps/v1
kind: Deployment
metadata:
  name: elpris-app
  labels:
    app: elpris-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elpris-app
  template:
    metadata:
      labels:
        app: elpris-app
    spec:
      containers:
        - name: elpris-app
          image: elpris-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2800
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 2800
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 2800
            initialDelaySeconds: 5
            periodSeconds: 5
