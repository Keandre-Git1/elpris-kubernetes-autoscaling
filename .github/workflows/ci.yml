name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.17.6

      - name: Lint
        run: ruff check application tests

      - name: Run tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  docker:
    name: Bygg och testa Docker-imagen
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bygg imagen
        run: docker build -t elpris:${{ github.sha}} .
      
      - name: Starta containern och kontrollera /health
        run:  |
          docker run -d --name elpris -p 2800:2800 elpris:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:2800/health; then
              echo "appen svarar"
              exit 0
            fi
            sleep 2
          done
          echo "Appen svarade inte på /health"
          docker logs elpris
          exit 1

      - name: Logga in på GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pusha imagen till GHCR
        if: github.event_name == 'push'
        env:
          GHCR_IMAGE: ghcr.io/keandre-git1/elpris-kubernetes-autoscaling:${{ github.sha }}
        run: |
          docker tag elpris:${{ github.sha }} "$GHCR_IMAGE"
          docker push "$GHCR_IMAGE"
